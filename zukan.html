<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人気の庭木図鑑 出雲版 | Takezo植栽ガイド</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gd:#6e5942;--gm:#9a805d;--gl:#c2a57f;--gp:#ede2d1;--cream:#faf4ea;--ww:#fffdf7;--earth:#8b6914;--td:#3a2f24;--tm:#7d6f5d;--sh:0 4px 24px rgba(74,58,40,.12);--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",sans-serif;background:var(--cream);color:var(--td);min-height:100vh}
header{background:#f8f3ea;border-bottom:1px solid #e8dcc8;padding:16px 22px;position:sticky;top:0;z-index:100;box-shadow:0 1px 10px rgba(74,58,40,.05)}
.hi{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:"Noto Serif JP",serif;font-size:1.3rem;font-weight:700;color:#3a322a;white-space:nowrap;letter-spacing:.02em}
.logo span{color:#9a8a72;font-size:.66rem;display:block;font-weight:400;letter-spacing:.14em}
.sw{flex:1;min-width:170px;position:relative}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#b3a274}
#si{width:100%;padding:9px 12px 9px 38px;border:1px solid #e3d7c2;border-radius:50px;background:#fff;color:#3a322a;font-size:.86rem;font-family:"Noto Sans JP",sans-serif;outline:none;transition:border .2s}
#si::placeholder{color:#a89c87}
#si:focus{border-color:#c2b48c}
#cntbadge{background:#ece1cd;color:#6b5d49;border-radius:50px;padding:5px 12px;font-size:.76rem;white-space:nowrap;font-weight:500}
.fw{background:var(--ww);border-bottom:1px solid rgba(74,58,40,.1);padding:8px 22px;overflow-x:auto;scrollbar-width:none}
.fw::-webkit-scrollbar{display:none}
.fi{max-width:1400px;margin:0 auto;display:flex;gap:6px;align-items:center}
.fl{font-size:.68rem;color:var(--tm);white-space:nowrap;margin-right:1px}
.fb{padding:4px 12px;border:1.5px solid rgba(138,109,74,.28);border-radius:50px;background:transparent;color:var(--gm);font-size:.74rem;font-family:"Noto Sans JP",sans-serif;cursor:pointer;white-space:nowrap;transition:all .18s}
.fb:hover{background:var(--gp)}.fb.active{background:var(--gm);color:#fff;border-color:var(--gm)}
.sb{padding:4px 10px;border:1.5px solid rgba(139,105,20,.28);border-radius:50px;background:transparent;color:var(--earth);font-size:.74rem;font-family:"Noto Sans JP",sans-serif;cursor:pointer;white-space:nowrap;transition:all .18s}
.sb:hover{background:#fef3c7}.sb.active{background:var(--earth);color:#fff}
.dv{width:1px;height:20px;background:rgba(74,58,40,.14);margin:0 2px;flex-shrink:0}
.main{max-width:1400px;margin:0 auto;padding:20px 22px}
.sbar{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:.74rem;color:var(--tm);flex-wrap:wrap}
.stb{padding:4px 10px;border:1px solid rgba(74,58,40,.18);border-radius:50px;background:transparent;color:var(--tm);font-size:.68rem;font-family:"Noto Sans JP",sans-serif;cursor:pointer;transition:all .15s}
.stb:hover{background:var(--gp)}.stb.active{background:var(--gd);color:#fff;border-color:var(--gd)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}
.card{background:var(--ww);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;transition:transform .2s,box-shadow .2s;overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(74,58,40,.06)}
.card:hover{transform:translateY(-3px);box-shadow:0 7px 28px rgba(74,58,40,.18)}
.cimg{position:relative;width:100%;height:160px;overflow:hidden;background:linear-gradient(135deg,#f8f1e7,#ece0cd);flex-shrink:0}
.ci{width:100%;height:100%;object-fit:contain;transition:transform .4s;display:none;position:absolute;inset:0;cursor:zoom-in}
.card:hover .ci{transform:scale(1.06)}
.cph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--gm);opacity:.4;position:absolute;inset:0}
.cph svg{width:32px;height:32px}.cph span{font-size:.68rem}
.cld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sp{width:24px;height:24px;border:2.5px solid rgba(138,109,74,.18);border-top-color:var(--gm);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ch{padding:12px 14px 8px;background:linear-gradient(135deg,rgba(138,109,74,.05),rgba(176,142,99,.03));border-bottom:1px solid rgba(74,58,40,.07)}
.cn{font-family:"Noto Serif JP",serif;font-size:1rem;font-weight:700;color:var(--gd);margin-bottom:3px;line-height:1.3}
.cm{display:flex;gap:4px;flex-wrap:wrap}
.badge{padding:1px 7px;border-radius:50px;font-size:.62rem;font-weight:500;white-space:nowrap}
.bt-常緑広葉樹{background:#f3eada;color:#5c4a32}.bt-落葉広葉樹{background:#fef3c7;color:#92400e}
.bt-常緑針葉樹{background:#e9ecdf;color:#555e3a}.bt-竹笹類{background:#eeede0;color:#6b6535}
.bt-芝類,.bt-常緑多年草{background:#faf6ef;color:#6e5532}.bt-常緑ツル性{background:#f6e8de;color:#8a5638}
.bt-宿根{background:#f2e6e0;color:#8a5a52}.bt-fam{background:rgba(74,58,40,.08);color:var(--gd)}
.cb2{padding:10px 14px 12px;flex:1}
.ir{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ii{display:flex;flex-direction:column;gap:1px}
.il{font-size:.58rem;color:var(--tm)}.iv{font-size:.78rem;color:var(--td);font-weight:500}
.dsc{font-size:.74rem;color:var(--tm);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf{padding:6px 14px;background:rgba(74,58,40,.03);border-top:1px solid rgba(74,58,40,.06);display:flex;gap:8px;flex-wrap:wrap}
.mb{font-size:.62rem;color:var(--tm)}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--tm)}
#loading{position:fixed;inset:0;background:var(--gd);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
#loading p{color:var(--gp);font-size:.9rem;font-family:"Noto Serif JP",serif}
.mo{display:none;position:fixed;inset:0;background:rgba(40,30,20,.65);backdrop-filter:blur(5px);z-index:200;align-items:center;justify-content:center;padding:14px}
.mo.open{display:flex}
.modal{background:var(--ww);border-radius:22px;max-width:760px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 70px rgba(0,0,0,.35);animation:su .24s ease;scrollbar-width:thin;scrollbar-color:var(--gp) transparent}
@keyframes su{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhero{position:relative}
.mmi{width:100%;height:260px;object-fit:contain;border-radius:22px 22px 0 0;display:block;background:linear-gradient(135deg,#f8f1e7,#ece0cd);cursor:zoom-in}
.mph{width:100%;height:260px;border-radius:22px 22px 0 0;background:linear-gradient(135deg,#6e5942,#9a805d);display:flex;align-items:center;justify-content:center}
.mph .sp{width:40px;height:40px;border-color:rgba(255,255,255,.2);border-top-color:#fff}
.mgrd{position:absolute;inset:0;background:linear-gradient(to top,rgba(38,28,18,.88) 0%,rgba(38,28,18,.12) 58%,transparent 100%);border-radius:22px 22px 0 0}
.mhc{position:absolute;bottom:0;left:0;right:0;padding:16px 24px}
.mt{font-family:"Noto Serif JP",serif;font-size:1.75rem;font-weight:700;color:#fff;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.mbd{display:flex;gap:6px;flex-wrap:wrap}
.mbs{padding:3px 10px;border-radius:50px;font-size:.68rem;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.24)}
.cbtn{position:absolute;top:13px;right:13px;width:33px;height:33px;background:rgba(255,255,255,.2);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;backdrop-filter:blur(4px)}
.cbtn:hover{background:rgba(255,255,255,.35)}
.fps{padding:16px 24px 0}
.fpt{font-size:.7rem;font-weight:600;color:var(--gm);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.fpg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fpw{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(135deg,#f8f1e7,#ece0cd);cursor:pointer}
.fpimg{width:100%;height:100%;object-fit:contain;display:block;transition:transform .3s;background:linear-gradient(135deg,#f8f1e7,#ece0cd)}
.fpw:hover .fpimg{transform:scale(1.05)}
.fplbl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.68),transparent);padding:14px 6px 5px;font-size:.6rem;color:#fff;text-align:center;font-weight:500}
.fph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.mbody{padding:16px 24px 24px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.sc{background:linear-gradient(135deg,rgba(138,109,74,.06),rgba(176,142,99,.04));border:1px solid rgba(138,109,74,.12);border-radius:10px;padding:8px 10px}
.sl{font-size:.58rem;color:var(--gm);letter-spacing:.08em;margin-bottom:2px;text-transform:uppercase}
.sv{font-size:.86rem;font-weight:600;color:var(--gd)}
.sec{margin-bottom:14px}
.stl{font-family:"Noto Serif JP",serif;font-size:.86rem;font-weight:600;color:var(--gd);margin-bottom:5px;padding-bottom:4px;border-bottom:2px solid var(--gp);display:flex;align-items:center;gap:5px}
.df{font-size:.85rem;line-height:1.8;color:var(--tm)}
.pl{display:flex;flex-wrap:wrap;gap:4px}
.pt{background:#f7eae4;color:#9a4a38;border:1px solid #e3c4b8;padding:2px 7px;border-radius:50px;font-size:.68rem}
.pn{color:var(--gm);font-size:.82rem}
.nb{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:.8rem;color:#78350f;line-height:1.6}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:400;align-items:center;justify-content:center;padding:18px}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:84vh;object-fit:contain;border-radius:8px}
.lbc{position:fixed;top:16px;right:16px;width:40px;height:40px;background:rgba(255,255,255,.14);border:none;border-radius:50%;cursor:pointer;color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center}
.lbc:hover{background:rgba(255,255,255,.26)}
.wiki-credit{font-size:.58rem;color:rgba(255,255,255,.55);position:absolute;bottom:4px;right:8px;z-index:2}
@media(max-width:600px){
  header{padding:12px 14px}.fw{padding:7px 14px}.main{padding:12px 14px}
  #grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .cimg{height:120px}.cn{font-size:.88rem}
  .mt{font-size:1.3rem}.mmi,.mph{height:200px}
  .mhc{padding:12px 16px}.fps,.mbody{padding-left:14px;padding-right:14px}
  .fpg{gap:6px}
}

/* ===== 表紙ログイン ＋ 管理者編集 ===== */
#cover{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#6e5a44,#917657 60%,#ae9269);padding:20px}
.cvbox{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:32px 26px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
.cvlogo{font-size:1.5rem;font-weight:800;color:#7a6149;letter-spacing:.04em}
.cvsub{font-size:.72rem;color:#aa9a86;margin:4px 0 22px;letter-spacing:.08em}
.cvfield{text-align:left;margin-bottom:14px}
.cvfield label{display:block;font-size:.72rem;color:#857260;font-weight:700;margin-bottom:5px}
.cvfield input{width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid #efe5d4;
  border-radius:10px;font-size:1rem;outline:none;transition:border .15s}
.cvfield input:focus{border-color:#ae9269}
.cverr{display:none;color:#c0392b;font-size:.78rem;margin:-4px 0 12px}
.cvbtn{width:100%;padding:12px;margin-top:6px;border:none;border-radius:10px;cursor:pointer;
  background:#917657;color:#fff;font-size:1rem;font-weight:700;letter-spacing:.3em;transition:background .15s}
.cvbtn:hover{background:#7a6149}

/* 管理者ボタン */
#adminBtn{margin-left:10px;padding:6px 12px;border:1.5px solid #cdbf9e;background:transparent;color:#6b5d49;
  border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer;white-space:nowrap}
#adminBtn:hover{background:rgba(228,213,189,.15)}
body.admin #adminBtn{background:#e2c794;border-color:#e2c794;color:#5a4500}

/* 編集ボタン（管理者時のみモーダル内に表示） */
.ebtn{position:absolute;top:12px;left:12px;z-index:6;display:none;align-items:center;gap:4px;
  padding:7px 13px;border:none;border-radius:20px;background:#e2c794;color:#5a4500;
  font-size:.8rem;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
body.admin .ebtn{display:inline-flex}

/* 保存バー */
#saveBar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:900;
  align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  padding:11px 16px;background:#7a6149;color:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.sbnote{font-size:.74rem;color:#f1e8d8;flex:1 1 240px;min-width:200px}
#saveBar button{border:none;border-radius:9px;cursor:pointer;font-weight:800;padding:10px 16px;font-size:.86rem}
.sbadd{background:#f1e8d8;color:#7a6149}
.sbsave{background:#e2c794;color:#5a4500}
#saveBar button:hover{opacity:.88}

/* 編集フォーム オーバーレイ */
.editM{position:fixed;inset:0;z-index:9500;display:none;align-items:flex-start;justify-content:center;
  background:rgba(40,30,20,.55);padding:24px 14px;overflow-y:auto}
.editM.open{display:flex}
.edcard{width:100%;max-width:560px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);margin:auto}
.edhd{background:#917657;color:#fff;font-weight:800;font-size:1.05rem;padding:16px 22px}
.edbody{padding:18px 22px;max-height:62vh;overflow-y:auto}
.edrow{display:block;margin-bottom:14px}
.edlbl{display:block;font-size:.76rem;font-weight:700;color:#76624c;margin-bottom:5px}
.edrow input,.edrow textarea,.edrow select{width:100%;box-sizing:border-box;padding:9px 11px;
  border:1.5px solid #efe5d4;border-radius:9px;font-size:.95rem;outline:none;font-family:inherit}
.edrow textarea{resize:vertical;line-height:1.5}
.edrow input:focus,.edrow textarea:focus,.edrow select:focus{border-color:#ae9269}
.edft{display:flex;gap:10px;flex-wrap:wrap;padding:16px 22px;background:#faf5ec;border-top:1px solid #f0e8da}
.edft button{border:none;border-radius:9px;cursor:pointer;font-weight:800;padding:11px 16px;font-size:.9rem}
.edsave{background:#917657;color:#fff;flex:1 1 auto}
.eddel{background:#fbe3e0;color:#c0392b}
.edcancel{background:#f1e9dc;color:#857260}
.edft button:hover{opacity:.9}


.edsec{font-size:.82rem;font-weight:800;color:#5e4c38;margin:16px 0 10px;padding-top:14px;border-top:1px solid #e8dcc8}
.edphwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.edthumb{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid #e3d7c2;background:#faf6ee}
.ednoimg{width:74px;height:74px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px dashed #cdbf9e;color:#a89c87;font-size:.68rem;background:#faf6ee}
.edphbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edpick{background:#9a805d;color:#fff;padding:8px 13px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;display:inline-block}
.edphdel{background:#efe5d4;color:#6f5d49;border:none;padding:8px 12px;border-radius:8px;font-size:.8rem;cursor:pointer}
</style>
</head>
<body>

<div id="cover">
  <div class="cvbox">
    <div class="cvlogo">人気の庭木図鑑 出雲版</div>
    <div class="cvsub">Takezo 植栽提案ガイド 2026</div>
    <div class="cvfield"><label>ID</label><input id="loginId" type="text" autocomplete="off" onkeydown="loginKey(event)" placeholder="ID を入力"></div>
    <div class="cvfield"><label>パスコード</label><input id="loginPw" type="password" onkeydown="loginKey(event)" placeholder="パスコードを入力"></div>
    <div id="loginErr" class="cverr">ID またはパスコードが違います</div>
    <button class="cvbtn" onclick="doLogin()">入　室</button>
  </div>
</div>
<div id="editM" class="editM"></div>


<div id="loading">
  <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ede2d1" stroke-width="1.5"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/><path d="M17 8c0-2.76-2.24-5-5-5S7 5.24 7 8"/></svg>
  <p>図鑑データを読み込み中…</p>
</div>

<header>
  <div class="hi">
    <div class="logo">人気の庭木図鑑 出雲版<span>Takezo 植栽提案ガイド 2026</span></div>
    <div class="sw">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="si" placeholder="樹木名・科名・特徴で検索…" oninput="flt()">
    </div>
    <div id="cntbadge">読込中</div>
      <button id="adminBtn" onclick="adminLogin()">管理者</button>
  </div>
</header>

<div class="fw">
  <div class="fi">
    <span class="fl">種別：</span>
    <button class="fb active" onclick="setT('')" data-t="">すべて</button>
    <button class="fb" onclick="setT('常緑広葉樹')" data-t="常緑広葉樹">常緑広葉樹</button>
    <button class="fb" onclick="setT('落葉広葉樹')" data-t="落葉広葉樹">落葉広葉樹</button>
    <button class="fb" onclick="setT('常緑針葉樹')" data-t="常緑針葉樹">常緑針葉樹</button>
    <button class="fb" onclick="setT('宿根')" data-t="宿根">宿根</button>
    <button class="fb" onclick="setT('竹笹類')" data-t="竹笹類">竹笹</button>
    <button class="fb" onclick="setT('常緑多年草')" data-t="常緑多年草">常緑多年草</button>
    <button class="fb" onclick="setT('常緑ツル性')" data-t="常緑ツル性">ツル性</button>
    <div class="dv"></div>
    <span class="fl">日照：</span>
    <button class="sb active" onclick="setSun('')">すべて</button>
    <button class="sb" onclick="setSun('◎')">◎全日</button>
    <button class="sb" onclick="setSun('〇')">〇半日</button>
    <button class="sb" onclick="setSun('△')">△日陰</button>
    <div class="dv"></div>
    <span class="fl">灌水：</span>
    <button class="sb active" onclick="setW('')">すべて</button>
    <button class="sb" onclick="setW('多')">多</button>
    <button class="sb" onclick="setW('中')">中</button>
    <button class="sb" onclick="setW('少')">少</button>
  </div>
</div>

<div class="main">
  <div class="sbar">
    <span>並び替え：</span>
    <button class="stb active" onclick="setSort('n')" id="sn">名前順</button>
    <button class="stb" onclick="setSort('t')" id="st">種別順</button>
    <button class="stb" onclick="setSort('fl')" id="sf">開花月順</button>
    <button class="stb" onclick="setSort('h')" id="sh">高さ順</button>
  </div>
  <div id="grid"><div class="empty"><p>データを読み込んでいます…</p></div></div>
</div>

<div class="mo" id="mo" onclick="bgC(event)">
  <div class="modal" id="modal">
    <div class="mhero">
      <button class="cbtn" onclick="closeM()">

<script src="imgmap.js"></script>
<script>
var PD = [];
var cache = {};
var cur = null;
var tf='', sunf='', wf='', sk='n';
var fdata = [];

// ── LOAD plants.js ────────────────────────────────────────────
function loadData() {
  var s = document.createElement('script');
  s.src = 'plants.js';
  s.onload = function() {
    fdata = PD.slice();
    document.getElementById('cntbadge').textContent = PD.length + '種';
    var ld = document.getElementById('loading');
    ld.classList.add('hide');
    setTimeout(function(){ ld.style.display='none'; }, 500);
    renderGrid();
  };
  s.onerror = function() {
    document.getElementById('grid').innerHTML = '<div class="empty"><p>⚠️ plants.js が見つかりません。両ファイルを同じフォルダに置いてください。</p></div>';
    document.getElementById('loading').classList.add('hide');
  };
  document.head.appendChild(s);
}

// ── WIKIPEDIA IMAGE FETCH (APIキー不要・CORS対応) ─────────────
var WP = 'https://ja.wikipedia.org/w/api.php';

async function fetchImgs(name) {
  if (cache[name]) return cache[name];
  var res = { m: "", x: ["","",""] };
  if (typeof IMGMAP !== "undefined" && IMGMAP[name]) {
    var lm = IMGMAP[name];
    res = { m: lm.m || "", x: (lm.f || []).concat(["","",""]).slice(0,3) };
  }
  cache[name] = res;
  return res;
}

var obs = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) {
    if (e.isIntersecting) {
      var el = e.target, nm = el.dataset.plant;
      if (nm && !el.dataset.ld) {
        el.dataset.ld = '1';
        loadCardImg(el, nm);
        obs.unobserve(el);
      }
    }
  });
}, {rootMargin: '280px'});

async function loadCardImg(wrap, name) {
  var imgs = await fetchImgs(name);
  var url = imgs.m;
  var img = wrap.querySelector('.ci');
  var sp = wrap.querySelector('.cld');
  var ph = wrap.querySelector('.cph');
  if (url) {
    img.src = url;
    img.onload = function(){ if(sp) sp.style.display='none'; img.style.display='block'; };
    img.onerror = function(){
      // Try English Wikipedia as fallback
      tryEnWiki(wrap, name);
    };
  } else {
    tryEnWiki(wrap, name);
  }
}

function tryEnWiki(wrap, name) {
  var sp = wrap.querySelector('.cld');
  var ph = wrap.querySelector('.cph');
  if(sp) sp.style.display='none';
  if(ph) ph.style.display='flex';
}

// ── FILTERS ───────────────────────────────────────────────────
function setT(v) {
  tf=v;
  document.querySelectorAll('.fb').forEach(function(b){ b.classList.toggle('active', b.dataset.t===v); });
  flt();
}
function setSun(v) {
  sunf=v;
  var btns=document.querySelectorAll('.sb'), vs=['','◎','〇','△'], i=0;
  btns.forEach(function(b){ if(i<4){b.classList.toggle('active',vs[i]===v);} i++; });
  flt();
}
function setW(v) {
  wf=v;
  var btns=Array.from(document.querySelectorAll('.sb')).slice(4), vs=['','多','中','少'];
  btns.forEach(function(b,i){ b.classList.toggle('active',vs[i]===v); });
  flt();
}
function setSort(k) {
  sk=k;
  document.querySelectorAll('.stb').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('s'+k[0]).classList.add('active');
  renderGrid();
}
function flt() {
  var q=document.getElementById('si').value.trim().toLowerCase();
  fdata = PD.filter(function(p) {
    if(tf && p.t!==tf) return false;
    if(sunf && !p.su.includes(sunf)) return false;
    if(wf && p.w!==wf) return false;
    if(q && !p.n.toLowerCase().includes(q) && !p.f.toLowerCase().includes(q) && !p.d.toLowerCase().includes(q) && !p.t.toLowerCase().includes(q)) return false;
    return true;
  });
  renderGrid();
}
function doSort() {
  return fdata.slice().sort(function(a,b) {
    if(sk==='n') return a.n.localeCompare(b.n,'ja');
    if(sk==='t') return (a.t||'zzz').localeCompare(b.t||'zzz','ja');
    if(sk==='fl') return (parseInt(a.fl)||99)-(parseInt(b.fl)||99);
    if(sk==='h') return (parseFloat(b.h)||0)-(parseFloat(a.h)||0);
    return 0;
  });
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function si(s){ return !s?'':s.includes('◎')?'☀️':s.includes('〇')?'⛅':'🌥️'; }
function tc(t){ return 'badge '+(t?'bt-'+t:''); }

// ── RENDER GRID ────────────────────────────────────────────────
function renderGrid() {
  var list=doSort();
  document.getElementById('cntbadge').textContent=list.length+'種';
  var g=document.getElementById('grid');
  if(!list.length){
    g.innerHTML='<div class="empty"><p>該当する植物が見つかりませんでした</p></div>';
    return;
  }
  g.innerHTML = list.map(function(p) {
    var en=esc(p.n), nm=p.n.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    return '<div class="card" onclick="openM(this)" data-name="'+nm+'">'
      +'<div class="cimg" data-plant="'+en+'">'
        +'<div class="cld"><div class="sp"></div></div>'
        +'<img class="ci" src="" alt="'+en+'" onclick="event.stopPropagation();if(this.src)openLB(this.src);">'
        +'<div class="cph" style="display:none">'
          +'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a10 10 0 0 1 10 10c0 4-2.5 8-7 10l-3-4-3 4c-4.5-2-7-6-7-10A10 10 0 0 1 12 2z"/><circle cx="12" cy="10" r="3"/></svg>'
          +'<span>'+en+'</span>'
        +'</div>'
      +'</div>'
      +'<div class="ch">'
        +'<div class="cn">'+en+'</div>'
        +'<div class="cm">'
          +(p.t?'<span class="'+tc(p.t)+'">'+esc(p.t)+'</span>':'')
          +(p.f?'<span class="badge bt-fam">'+esc(p.f)+'</span>':'')
        +'</div>'
      +'</div>'
      +'<div class="cb2">'
        +'<div class="ir">'
          +(p.fl?'<div class="ii"><span class="il">開花</span><span class="iv">🌸 '+esc(p.fl)+'月</span></div>':'')
          +(p.h?'<div class="ii"><span class="il">樹高</span><span class="iv">🌲 '+esc(p.h)+'m</span></div>':'')
          +(p.su?'<div class="ii"><span class="il">日照</span><span class="iv">'+si(p.su)+' '+esc(p.su)+'</span></div>':'')
          +(p.w?'<div class="ii"><span class="il">灌水</span><span class="iv">💧 '+esc(p.w)+'</span></div>':'')
        +'</div>'
        +(p.d?'<div class="dsc">'+esc(p.d)+'</div>':'')
      +'</div>'
      +'<div class="cf">'
        +(p.c?'<span class="mb">❄️ 耐寒：'+esc(p.c)+'</span>':'')
        +(p.pr?'<span class="mb">✂️ '+esc(p.pr)+'</span>':'')
        +(p.al&&p.al!=='-'?'<span class="mb">🍂 '+esc(p.al)+'</span>':'')
      +'</div>'
    +'</div>';
  }).join('');
  document.querySelectorAll('.cimg[data-plant]').forEach(function(el){ obs.observe(el); });
}

// ── MODAL ──────────────────────────────────────────────────────
async function openM(cardEl) {
  var name = cardEl.dataset.name;
  var p = PD.find(function(x){ return x.n===name; });
  if(!p) return;
  cur = name;

  document.getElementById('mttl').textContent = p.n;
  document.getElementById('mbdg').innerHTML = [p.t,p.f].filter(Boolean).map(function(b){ return '<span class="mbs">'+esc(b)+'</span>'; }).join('');

  // Main image - show spinner
  var mmain = document.getElementById('mmain');
  var cached = cache[name];
  if(cached && cached.m) {
    mmain.innerHTML = '<img class="mmi" src="'+cached.m+'" alt="'+esc(name)+'" onclick="openLB(\''+cached.m.replace(/'/g,"\\'")+'\')" onerror="this.style.display=\'none\'">'+'';
  } else {
    mmain.innerHTML = '<div class="mph"><div class="sp"></div></div>';
  }

  // Feature photo placeholders
  var lbls = ['花・開花','葉・樹形','実・特徴'];
  document.getElementById('fpg').innerHTML = lbls.map(function(lb,i){
    return '<div class="fpw" id="fp'+i+'"><div class="fph"><div class="sp" style="width:20px;height:20px"></div></div><div class="fplbl">'+lb+'</div></div>';
  }).join('');

  // Stats
  var pests = p.p ? p.p.split('\n').map(function(s){return s.trim();}).filter(Boolean) : [];
  var hasP = pests.length>0 && !pests.some(function(x){return x.includes('ほとんど')||x.includes('特に見当');});
  document.getElementById('mbody').innerHTML =
    '<div class="sg">'
      +(p.fl?'<div class="sc"><div class="sl">🌸 開花時期</div><div class="sv">'+esc(p.fl)+'月</div></div>':'')
      +(p.h?'<div class="sc"><div class="sl">🌲 樹高(m)</div><div class="sv">'+esc(p.h)+'</div></div>':'')
      +(p.su?'<div class="sc"><div class="sl">☀️ 日照</div><div class="sv">'+esc(p.su)+'</div></div>':'')
      +(p.w?'<div class="sc"><div class="sl">💧 灌水</div><div class="sv">'+esc(p.w)+'</div></div>':'')
      +(p.c?'<div class="sc"><div class="sl">❄️ 耐寒性</div><div class="sv">'+esc(p.c)+'</div></div>':'')
      +(p.dw?'<div class="sc"><div class="sl">🌊 乾湿耐性</div><div class="sv">'+esc(p.dw)+'</div></div>':'')
      +(p.td?'<div class="sc"><div class="sl">🌊 耐潮性</div><div class="sv">'+esc(p.td)+'</div></div>':'')
      +(p.al&&p.al!=='-'?'<div class="sc"><div class="sl">🍂 紅葉</div><div class="sv">'+esc(p.al)+'</div></div>':'')
      +(p.pr?'<div class="sc"><div class="sl">✂️ 剪定</div><div class="sv">'+esc(p.pr)+'</div></div>':'')
      +(p.so?'<div class="sc"><div class="sl">🌱 土壌</div><div class="sv">'+esc(p.so)+'</div></div>':'')
    +'</div>'
    +(p.d?'<div class="sec"><div class="stl">📄 特徴・解説</div><p class="df">'+esc(p.d)+'</p></div>':'')
    +'<div class="sec"><div class="stl">🛡️ 病害虫</div>'
      +(hasP?'<div class="pl">'+pests.map(function(x){return '<span class="pt">'+esc(x)+'</span>';}).join('')+'</div>'
            :'<p class="pn">✅ '+(pests.length?esc(pests[0]):'情報なし')+'</p>')
    +'</div>'
    +(p.nt?'<div class="sec"><div class="stl">⚠️ 備考</div><div class="nb">'+esc(p.nt)+'</div></div>':'');

  document.getElementById('mo').classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('modal').scrollTop=0;

  // Fetch images
  var imgs = await fetchImgs(name);
  if(cur!==name) return;

  // Update main
  if(imgs.m) {
    mmain.innerHTML='<img class="mmi" src="'+imgs.m+'" alt="'+esc(name)+'" onclick="openLB(\''+imgs.m.replace(/'/g,"\\'")+'\')" onerror="this.style.display=\'none\'">'+'';
  } else {
    mmain.innerHTML='<div class="mph"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:54px;height:54px;color:rgba(255,255,255,.2)"><path d="M12 2a10 10 0 0 1 10 10c0 4-2.5 8-7 10l-3-4-3 4c-4.5-2-7-6-7-10A10 10 0 0 1 12 2z"/><circle cx="12" cy="10" r="3"/></svg></div>';
  }

  // Update feature photos
  lbls.forEach(function(lb, i) {
    var wrap=document.getElementById('fp'+i);
    if(!wrap) return;
    var url=imgs.x[i];
    if(url) {
      var safeU=url.replace(/'/g,'%27');
      wrap.innerHTML='<img class="fpimg" src="'+url+'" alt="'+esc(name)+' '+esc(lb)+'" onclick="openLB(\''+safeU+'\')" onerror="this.parentElement.innerHTML=\'<div class=fph></div><div class=fplbl>'+lb+'</div>\'">'
        +'<div class="fplbl">'+lb+'</div>';
    } else {
      wrap.innerHTML='<div class="fph"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9a805d" stroke-width="1.5" opacity=".32"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="fplbl">'+lb+'</div>';
    }
  });

  // Update card img if not loaded
  var cw=document.querySelector('.cimg[data-plant="'+esc(name)+'"]');
  if(cw&&!cw.dataset.ld&&imgs.m){
    cw.dataset.ld='1';
    var ci=cw.querySelector('.ci'), cld=cw.querySelector('.cld'), cph=cw.querySelector('.cph');
    ci.src=imgs.m;
    ci.onload=function(){if(cld)cld.style.display='none';ci.style.display='block';};
    ci.onerror=function(){if(cld)cld.style.display='none';if(cph)cph.style.display='flex';};
    obs.unobserve(cw);
  }
}

/* ===== 表紙ログイン ＋ 管理者編集 ＋ 保存(ダウンロード) ===== */

var EDIT_FIELDS=[
 ["n","樹木名","text"],["f","科名","text"],["t","種別","select"],
 ["fl","開花時期（月）　例: 3～5","text"],["h","樹高(m)　例: 1～2","text"],
 ["su","日照（◎/〇/△ など）","text"],["w","灌水（多/中/少）","text"],
 ["c","耐寒性","text"],["dw","乾湿耐性","text"],["td","耐潮性","text"],
 ["al","紅葉","text"],["pr","剪定","text"],["so","土壌","text"],
 ["p","病害虫（1行に1つ書く）","textarea"],["d","説明","textarea"],["nt","備考","textarea"]
];
var TYPE_OPTS=["常緑広葉樹","落葉広葉樹","常緑針葉樹","宿根","竹笹類","常緑多年草","常緑ツル性","芝類",""];
var editName=null;

function escAttr(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

var editImgs={m:"",f:["","",""]};
function fileToDataURL(file,maxw,q,cb){
  var rd=new FileReader();
  rd.onload=function(ev){
    var im=new Image();
    im.onload=function(){
      var w=im.width,hh=im.height;
      if(w>maxw){hh=Math.round(hh*maxw/w);w=maxw;}
      var cv=document.createElement("canvas");cv.width=w;cv.height=hh;
      cv.getContext("2d").drawImage(im,0,0,w,hh);
      cb(cv.toDataURL("image/jpeg",q));
    };
    im.src=ev.target.result;
  };
  rd.readAsDataURL(file);
}
function photoRow(label,key,src){
  return '<div class="edrow"><span class="edlbl">'+label+'</span><div class="edphwrap">'
    +'<img class="edthumb" id="edimg_'+key+'" src="'+(src||"")+'" alt=""'+(src?"":' style="display:none"')+'>'
    +'<span class="ednoimg" id="edno_'+key+'"'+(src?' style="display:none"':"")+'>写真なし</span>'
    +'<div class="edphbtns"><label class="edpick"><input type="file" accept="image/*" id="edfile_'+key+'" onchange="pickImg(\''+key+'\')" style="display:none">写真を選ぶ</label>'
    +'<button type="button" class="edphdel" onclick="clearImg(\''+key+'\')">消す</button></div></div></div>';
}
function pickImg(key){
  var inp=document.getElementById("edfile_"+key);
  if(!inp||!inp.files||!inp.files[0])return;
  var isM=(key==="m");
  fileToDataURL(inp.files[0],isM?360:160,isM?0.55:0.45,function(durl){
    if(key==="m")editImgs.m=durl; else editImgs.f[parseInt(key.slice(1),10)]=durl;
    var img=document.getElementById("edimg_"+key); if(img){img.src=durl;img.style.display="";}
    var no=document.getElementById("edno_"+key); if(no)no.style.display="none";
  });
}
function clearImg(key){
  if(key==="m")editImgs.m=""; else editImgs.f[parseInt(key.slice(1),10)]="";
  var img=document.getElementById("edimg_"+key); if(img){img.src="";img.style.display="none";}
  var no=document.getElementById("edno_"+key); if(no)no.style.display="";
}
function downloadImgmapJS(){
  var js="var IMGMAP="+JSON.stringify(typeof IMGMAP!=="undefined"?IMGMAP:{})+";";
  var blob=new Blob([js],{type:"text/javascript;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="imgmap.js";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}
function openEdit(name){
  name = name || cur;
  var p = PD.find(function(x){return x.n===name;});
  if(!p) return;
  editName = name;
  var im=(typeof IMGMAP!=="undefined" && IMGMAP[name])?IMGMAP[name]:{m:"",f:[]};
  editImgs={m:im.m||"",f:[(im.f&&im.f[0])||"",(im.f&&im.f[1])||"",(im.f&&im.f[2])||""]};
  var h='<div class="edcard"><div class="edhd">植物の編集：'+escAttr(p.n)+'</div><div class="edbody">';
  EDIT_FIELDS.forEach(function(f){
    var key=f[0], label=f[1], type=f[2], val=(p[key]||"");
    h+='<label class="edrow"><span class="edlbl">'+label+'</span>';
    if(type==="textarea"){
      h+='<textarea id="ed_'+key+'" rows="3">'+escAttr(val)+'</textarea>';
    }else if(type==="select"){
      h+='<select id="ed_'+key+'">';
      TYPE_OPTS.forEach(function(o){
        h+='<option value="'+escAttr(o)+'"'+(o===val?" selected":"")+'>'+(o||"（種別なし）")+'</option>';
      });
      h+='</select>';
    }else{
      h+='<input type="text" id="ed_'+key+'" value="'+escAttr(val)+'">';
    }
    h+='</label>';
  });
  h+='<div class="edsec">写真（「写真を選ぶ」でメイン・特徴を差し替え）</div>';
  h+=photoRow("メイン写真","m",editImgs.m);
  h+=photoRow("特徴写真1","f0",editImgs.f[0]);
  h+=photoRow("特徴写真2","f1",editImgs.f[1]);
  h+=photoRow("特徴写真3","f2",editImgs.f[2]);
  h+='</div><div class="edft">'
    +'<button class="edsave" onclick="applyEdit()">この内容を反映</button>'
    +'<button class="eddel" onclick="deletePlant()">削除</button>'
    +'<button class="edcancel" onclick="closeEdit()">キャンセル</button>'
    +'</div></div>';
  var em=document.getElementById("editM");
  em.innerHTML=h;
  em.classList.add("open");
}
function closeEdit(){document.getElementById("editM").classList.remove("open");}

function applyEdit(){
  var p=PD.find(function(x){return x.n===editName;});
  if(!p){closeEdit();return;}
  EDIT_FIELDS.forEach(function(f){
    var el=document.getElementById("ed_"+f[0]);
    if(el) p[f[0]]=el.value;
  });
  if(typeof window.IMGMAP==="undefined") window.IMGMAP={};
  var feats=editImgs.f.filter(function(x){return x;});
  if(editImgs.m || feats.length){ IMGMAP[p.n]={m:editImgs.m||"",f:feats}; }
  else if(IMGMAP[p.n]){ delete IMGMAP[p.n]; }
  if(editName!==p.n && IMGMAP[editName]){ delete IMGMAP[editName]; }
  if(typeof cache!=="undefined"){ delete cache[editName]; delete cache[p.n]; }
  closeEdit();
  closeM();
  flt();
  alert("反映しました。\n画面下の『文章を保存(plants.js)』と、写真を変えたら『写真を保存(imgmap.js)』をダウンロードし、GitHubに上げ直すと全員に反映されます。");
}

function deletePlant(){
  if(!confirm("この植物を削除しますか？（保存してGitHubに上げ直すまでは元に戻せます）")) return;
  var i=PD.findIndex(function(x){return x.n===editName;});
  if(i>=0) PD.splice(i,1);
  closeEdit(); closeM(); flt();
}

function addPlant(){
  var name=prompt("新しい植物の名前を入力してください");
  if(!name) return;
  name=name.trim();
  if(!name) return;
  if(PD.some(function(x){return x.n===name;})){ alert("同じ名前の植物が既にあります"); return; }
  var np={}; EDIT_FIELDS.forEach(function(f){np[f[0]]="";}); np.n=name;
  PD.unshift(np); flt(); openEdit(name);
}

function downloadPlantsJS(){
  var js="var PD="+JSON.stringify(PD)+";";
  var blob=new Blob([js],{type:"text/javascript;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="plants.js";
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1000);
}

loadData();
</script>

<div id="saveBar">
  <span class="sbnote">編集後は「文章を保存(plants.js)」を、写真を変えたら「写真を保存(imgmap.js)」もダウンロードし、GitHubに上げ直すと全員に反映されます。</span>
  <button class="sbadd" onclick="addPlant()">＋ 新規追加</button>
  <button class="sbsave" onclick="downloadPlantsJS()">💾 文章を保存（plants.js）</button>
  <button class="sbsave" onclick="downloadImgmapJS()">🖼 写真を保存（imgmap.js）</button>
</div>
</body>
</html>
