<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#f5f5f0;min-height:100vh;color:#1a1a1a}
input,select,textarea,button{font-family:inherit}
.btn{cursor:pointer;border:1px solid #ccc;background:#fff;color:#1a1a1a;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;transition:background 0.15s}
.btn:hover{background:#f0f0f0}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn-primary:hover{background:#0F6E56}
.btn-accept{background:#378ADD;color:#fff;border-color:#378ADD;font-size:15px;padding:12px 20px;width:100%;border-radius:8px}
.btn-accept:hover{background:#185FA5}
.btn-danger{background:#E24B4A;color:#fff;border-color:#E24B4A}
.btn-danger:hover{background:#A32D2D}
.btn-sm{padding:5px 10px;font-size:12px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a}
input:focus,select:focus,textarea:focus{outline:2px solid #1D9E75;border-color:#1D9E75}
#toast{position:fixed;top:16px;right:16px;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none}
#toast.show{opacity:1}
.toast-ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.toast-err{background:#FCEBEB;color:#791F1F;border:1px solid #F09595}
.tab-btn{padding:8px 16px;border:1px solid #ddd;background:#f5f5f0;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:500;border-bottom:none}
.tab-btn.active{background:#fff;border-bottom:1px solid #fff;margin-bottom:-1px;color:#1D9E75}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f0f0f0}
.check-item:last-child{border-bottom:none}
.check-item input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#1D9E75;flex-shrink:0}
</style>

// ===== IndexedDB =====
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('gaikuDB',2);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('files')) d.createObjectStore('files');
      if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects');
      if(!d.objectStoreNames.contains('checks')) d.createObjectStore('checks');
    };
    req.onsuccess=e=>{db=e.target.result;resolve(db);};
    req.onerror=e=>reject(e);
  });
}
function dbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e);});}
function dbPut(store,key,val){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).put(val,key);r.onsuccess=()=>res();r.onerror=e=>rej(e);});}
function dbDelete(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=e=>rej(e);});}

function toast(msg,ok=true){
  const t=document.getElementById('toast');

function showManual(){
  const S=t=>'<h2 style="font-size:16px;font-weight:700;color:#1D9E75;margin:1.5rem 0 0.5rem;padding-bottom:6px;border-bottom:2px solid #1D9E75">'+t+'</h2>';
  const SB=t=>'<h3 style="font-size:14px;font-weight:600;color:#0F6E56;margin:1rem 0 0.3rem">'+t+'</h3>';
  const PP='font-size:14px;color:#333;line-height:1.7;margin:0.3rem 0';
  const TH='padding:8px 10px;text-align:left;font-weight:600';
  const UL=a=>a.map(i=>'<div style="font-size:13px;color:#333;padding:3px 0 3px 1rem;line-height:1.6">・'+i+'</div>').join('');
  const NOTE=t=>'<div style="background:#F0FBF7;border-left:4px solid #1D9E75;padding:8px 12px;margin:0.5rem 0;font-size:13px;color:#0F6E56;border-radius:0 6px 6px 0">'+t+'</div>';
  const TR=(lb,a,b,c,nt,ri)=>'<tr style="background:'+(ri%2===0?'#fff':'#f9f9f9')+'"><td style="padding:7px 10px;border-bottom:1px solid #eee">'+lb+'</td><td style="padding:7px 10px;border-bottom:1px solid #eee;color:'+(a==='○'?'#0F6E56':a==='×'?'#E24B4A':'#666')+';font-weight:'+(a==='○'||a==='×'?'600':'400')+'">'+a+'</td><td style="padding:7px 10px;border-bottom:1px solid #eee;color:'+(b==='○'?'#0F6E56':b==='×'?'#E24B4A':'#666')+';font-weight:'+(b==='○'||b==='×'?'600':'400')+'">'+b+'</td><td style="padding:7px 10px;border-bottom:1px solid #eee;color:'+(c==='○'?'#0F6E56':c==='×'?'#E24B4A':'#666')+';font-weight:'+(c==='○'||c==='×'?'600':'400')+'">'+c+'</td><td style="padding:7px 10px;border-bottom:1px solid #eee;color:#888;font-size:12px">'+nt+'</td></tr>';

  const html=`
  <div style="max-width:800px;margin:0 auto;padding:1rem">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
      <button class="btn btn-sm" onclick="showLogin()">← ログインに戻る</button>
      <span style="font-size:13px;color:#888">取扱説明書</span>
    </div>
    <div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:2rem">
      <div style="text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:2px solid #1D9E75">
        <p style="font-size:13px;color:#888;margin-bottom:4px">Art &amp; Garden</p>
        <h1 style="font-size:24px;font-weight:700;color:#1D9E75">外構工事 物件管理アプリ</h1>
        <p style="font-size:18px;color:#333;margin-top:4px">取扱説明書</p>
        <p style="font-size:13px;color:#888;margin-top:8px">Takezo Farm　外構工事部門</p>
      </div>
      ${S('1. アプリ概要')}
      <p style="${PP}">本アプリは外構工事の物件情報を一元管理し、監督・プランナーが着工前の準備を効率的に進めるためのWebアプリケーションです。</p>
      ${NOTE('アクセスURL: https://takezofarm288282-jpg.github.io/gaikotype-shinda-app/gaiku_app.html')}
      ${SB('主な機能')}
      ${UL(['物件一覧の表示・検索','物件詳細情報の確認（工事内容・場所・工期・金額）','工事場所のGoogleマップ連携','図面・資料（画像・PDF）のアップロード・プレビュー','着工前準備チェックシート（監督用・プランナー用）','物件の請負受付（監督のみ）'])}
      ${S('2. ログイン方法')}
      <p style="${PP}">URLにアクセスし、担当者のIDとパスワードを入力してログインしてください。</p>
      ${NOTE('※ パスワードは管理者がアプリ内の「ユーザー管理」から変更できます。')}
      ${S('3. 役割別の操作権限')}
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr style="background:#1D9E75;color:#fff">
          <th style="${TH}">機能</th><th style="${TH}">管理者</th><th style="${TH}">現場監督</th><th style="${TH}">プランナー</th><th style="${TH}">備考</th>
        </tr>
        ${TR('物件一覧の閲覧','○','○','○','',0)}
        ${TR('物件詳細の閲覧','○','○','○','',1)}
        ${TR('物件の追加','○','×','○','',0)}
        ${TR('物件の編集・削除','○','×','×','管理者のみ',1)}
        ${TR('図面・資料の追加','○','×','×','管理者のみ',0)}
        ${TR('依頼を請ける','×','○','×','募集中物件のみ',1)}
        ${TR('監督用チェック','閲覧のみ','○','閲覧のみ','請け負った物件のみ',0)}
        ${TR('プランナー用チェック','閲覧のみ','閲覧のみ','○','担当物件のみ',1)}
        ${TR('ユーザー管理','○','×','×','管理者のみ',0)}
        ${TR('チェック項目管理','○','×','×','管理者のみ',1)}
      </table></div>
      ${S('4. 物件一覧画面')}
      <p style="${PP}">ログイン後、登録されている全物件がカード形式で表示されます。</p>
      ${SB('表示内容')}
      ${UL(['物件名','ステータス（募集中 / 請負済み）','主な工事内容','工事場所（タップするとGoogleマップが開きます）','予定工期','希望工事金額（税別）','担当者名'])}
      ${SB('管理者・プランナーのみ表示されるボタン')}
      ${UL(['"＋ 物件追加"ボタン：新しい物件を登録します'])}
      ${SB('管理者のみ表示されるボタン')}
      ${UL(['"👥 ユーザー管理"ボタン：ユーザーの追加・編集・削除','"📋 チェック項目管理"ボタン：チェックシートの項目を編集'])}
      ${S('5. 物件詳細画面')}
      <p style="${PP}">物件カードをタップすると詳細画面が開きます。</p>
      ${SB('物件情報')}
      ${UL(['主な工事内容、工事場所、担当者名、予定工期、希望工事金額（税別）、コメント','工事場所の住所をタップ → Googleマップで現地確認できます'])}
      ${SB('図面・資料')}
      ${UL(['管理者が登録した図面・写真・PDFを確認できます','"プレビュー"ボタンで画面上に表示されます'])}
      ${SB('依頼を請ける（監督のみ）')}
      <p style="${PP}">募集中の物件で監督がログインしている場合「✅ 依頼を請ける」ボタンが表示されます。</p>
      ${UL(['ボタンを押すと確認ダイアログが表示されます','OKを押すとステータスが「請負済み」に変わります','担当監督名と受注日時が記録されます'])}
      ${NOTE('※ 請負済みになると他の監督は「依頼を請ける」ボタンが表示されなくなります。')}
      ${S('6. 着工前準備チェックシート')}
      <p style="${PP}">物件詳細画面の下部に「監督用」「プランナー用」の2つのタブが表示されます。</p>
      ${SB('チェック操作')}
      ${UL(['"✓"ボタン（緑）：完了 → 緑の取り消し線が入ります','"－"ボタン（グレー）：該当なし → グレーの取り消し線が入ります','もう一度同じボタンを押す → リセット（未対応に戻ります）'])}
      ${SB('チェック権限')}
      ${UL(['監督用：自分が請け負った物件のみチェック可能','プランナー用：担当者名が自分の物件のみチェック可能','「岡田/田中」の物件：岡田 望・田中 桃香の両方がチェック可能','管理者・相手の役割のシート：閲覧のみ（チェック不可）'])}
      ${S('7. 管理者向け操作')}
      ${SB('物件の追加・編集・削除')}
      ${UL(['"＋ 物件追加"から新規物件を登録','物件詳細の"✏️ 編集"から情報を更新','物件詳細の"🗑️ 削除"から物件を削除（添付ファイルも同時に削除されます）'])}
      ${SB('ユーザー管理')}
      ${UL(['"👥 ユーザー管理"からユーザーの一覧を確認','"＋ 追加"で新しいユーザーを登録','"編集"で名前・パスワードを変更（IDは変更不可）','"削除"でユーザーを削除'])}
      ${SB('チェック項目の管理')}
      ${UL(['"📋 チェック項目管理"から監督用・プランナー用の項目を編集','"＋ 追加"で追加 → 全物件に即座に反映','"☰"マークをドラッグで順番を変更できます'])}
      ${S('8. ご利用上の注意')}
      ${UL(['物件情報・ユーザー情報はブラウザ内に保存されます','同じ端末・同じブラウザからアクセスすればデータが保持されます','ブラウザのデータを消去するとデータが失われます'])}
      ${NOTE('ご不明な点は管理者（takezofarm）にお問い合わせください。')}
    </div>
  </div>`;
  render(html);
}


function doLogin(){
  const uid=document.getElementById('uid').value.trim();
  const pw=document.getElementById('upw').value;
  const u=USERS.find(u=>u.id===uid&&u.pass===pw);
  if(!u){document.getElementById('lerr').style.display='block';return;}
  currentUser=u;showList();
}

function statusBadge(p){
  if(p.status==='請負済み') return `<span style="background:#EEEDFE;color:#3C3489;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap">請負済み</span>`;

// ===== チェックシート表示 =====
function renderCheckSheet(projectId, type){
  const items=checkTemplates[type]||[];
  const key=`check_${projectId}_${type}`;
  const saved=JSON.parse(localStorage.getItem(key)||'{}');
  // 監督：自分が請け負った物件のみチェック可
  // プランナー：担当者名が自分の物件のみチェック可（岡田/田中は岡田望・田中桃香両方OK）
  const p_obj=projects.find(x=>x.id===projectId);
  const kantokuOK=currentUser.role==='kantoku' && p_obj && p_obj.assignee===currentUser.name;
  const plannerMatch=(tantou)=>{
    if(!tantou) return false;
    if(tantou===currentUser.name) return true;
    if(tantou==='岡田/田中' && (currentUser.name==='岡田 望'||currentUser.name==='田中 桃香')) return true;
    return false;
  };
  const plannerOK=currentUser.role==='planner' && p_obj && plannerMatch(p_obj.tantou);
  const canCheck=(type==='kantoku'&&kantokuOK)||(type==='planner'&&plannerOK);
  const typeLabel=type==='kantoku'?'監督':'プランナー';
  // saved[i] = 'done'(完了) or 'na'(該当なし) or undefined
  const done=items.filter((_,i)=>saved[i]==='done').length;
  const na=items.filter((_,i)=>saved[i]==='na').length;

  const rows=items.map((item,i)=>{
    const state=saved[i]||'';
    const isDone=state==='done';
    const isNA=state==='na';
    const labelStyle=isDone?'text-decoration:line-through;color:#1D9E75':isNA?'text-decoration:line-through;color:#bbb':'';
    if(type==='kantoku'){
      return `
  <div class="check-item" style="gap:6px">
    <button onclick="${canCheck?`toggleCheckState(${projectId},'${type}',${i},'done')`:'void(0)'}"
      style="flex-shrink:0;width:28px;height:28px;border-radius:6px;border:1.5px solid ${isDone?'#1D9E75':'#ccc'};background:${isDone?'#1D9E75':'#fff'};color:${isDone?'#fff':'#ccc'};font-size:14px;cursor:${canCheck?'pointer':'default'};display:flex;align-items:center;justify-content:center">✓</button>
    <button onclick="${canCheck?`toggleCheckState(${projectId},'${type}',${i},'na')`:'void(0)'}"
      style="flex-shrink:0;width:28px;height:28px;border-radius:6px;border:1.5px solid ${isNA?'#999':'#ccc'};background:${isNA?'#999':'#fff'};color:${isNA?'#fff':'#ccc'};font-size:12px;cursor:${canCheck?'pointer':'default'};display:flex;align-items:center;justify-content:center;font-weight:600">－</button>
    <span style="font-size:14px;${labelStyle}">${item}</span>
  </div>`;
    } else {
      return `
  <div class="check-item" style="gap:6px">
    <button onclick="${canCheck?`toggleCheckState(${projectId},'${type}',${i},'done')`:'void(0)'}"
      style="flex-shrink:0;width:28px;height:28px;border-radius:6px;border:1.5px solid ${isDone?'#1D9E75':'#ccc'};background:${isDone?'#1D9E75':'#fff'};color:${isDone?'#fff':'#ccc'};font-size:14px;cursor:${canCheck?'pointer':'default'};display:flex;align-items:center;justify-content:center">✓</button>
    <button onclick="${canCheck?`toggleCheckState(${projectId},'${type}',${i},'na')`:'void(0)'}"
      style="flex-shrink:0;width:28px;height:28px;border-radius:6px;border:1.5px solid ${isNA?'#999':'#ccc'};background:${isNA?'#999':'#fff'};color:${isNA?'#fff':'#ccc'};font-size:12px;cursor:${canCheck?'pointer':'default'};display:flex;align-items:center;justify-content:center;font-weight:600">－</button>
    <span style="font-size:14px;${labelStyle}">${item}</span>
  </div>`;
    }
  }).join('');

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <div style="font-size:13px;color:#666">${typeLabel}用チェックシート　<span style="font-weight:600;color:#1D9E75">${done}/${items.length} 完了</span>${na>0?` <span style="color:#999;font-size:12px">/ ${na}件 該当なし</span>`:''}</div>
    <div style="width:120px;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden">
      <div style="width:${items.length?Math.round((done+na)/items.length*100):0}%;height:100%;background:#1D9E75;border-radius:4px;transition:width 0.3s"></div>
    </div>
  </div>
  ${rows||'<p style="font-size:13px;color:#888">チェック項目がありません</p>'}
  ${!canCheck?`<p style="font-size:12px;color:#aaa;margin-top:8px">※ ${type==='kantoku'?'請け負った物件の監督':'担当プランナー'}のみチェックできます</p>`:''}`;
}

function switchTab(type, projectId){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+type)?.classList.add('active');
  document.getElementById('check-content').innerHTML=renderCheckSheet(projectId,type);
}

function toggleCheckState(projectId, type, idx, state){
  const key=`check_${projectId}_${type}`;
  const saved=JSON.parse(localStorage.getItem(key)||'{}');
  // 同じボタンを押したらリセット
  if(saved[idx]===state) saved[idx]='';
  else saved[idx]=state;
  localStorage.setItem(key,JSON.stringify(saved));
  const items=checkTemplates[type]||[];
  const done=items.filter((_,i)=>saved[i]==='done').length;
  const na=items.filter((_,i)=>saved[i]==='na').length;
  toast(`完了: ${done}件 / 該当なし: ${na}件`);
  // チェックシート部分だけ再描画
  const content=document.getElementById('check-content');
  if(content) content.innerHTML=renderCheckSheet(projectId,type);
}

function renderCheckTemplatePanel(type, title){
  const items=checkTemplates[type]||[];
  const rows=items.map((item,i)=>`
  <div draggable="true" data-type="${type}" data-idx="${i}"
    ondragstart="dragStart(event,${i})"
    ondragover="dragOver(event)"
    ondrop="dragDrop(event,'${type}',${i})"
    ondragend="dragEnd(event)"
    style="display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid #f0f0f0;cursor:grab;background:#fff;transition:background 0.1s">
    <span style="font-size:16px;color:#ccc;padding:0 4px">☰</span>
    <span style="font-size:13px;flex:1">${item}</span>
    <button class="btn btn-sm" onclick="editCheckItem('${type}',${i})">編集</button>
    <button class="btn btn-danger btn-sm" onclick="deleteCheckItem('${type}',${i})">削除</button>
  </div>`).join('');
  return `
  <div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1.25rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 style="font-size:15px;font-weight:600">${title}</h3>
      <button class="btn btn-primary btn-sm" onclick="addCheckItem('${type}')">＋ 追加</button>
    </div>
    <p style="font-size:11px;color:#aaa;margin-bottom:8px">☰ をドラッグして順番を変更できます</p>
    ${rows||'<p style="font-size:13px;color:#888">項目がありません</p>'}
  </div>`;
}

let dragSrcIdx=null;
function dragStart(e,idx){
  dragSrcIdx=idx;
  e.target.style.opacity='0.4';
  e.dataTransfer.effectAllowed='move';
}
function dragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.style.background='#f0faf5';
}
function dragEnd(e){
  e.target.style.opacity='1';
  document.querySelectorAll('[data-idx]').forEach(el=>el.style.background='#fff');
}
function dragDrop(e,type,toIdx){
  e.preventDefault();
  if(dragSrcIdx===null||dragSrcIdx===toIdx) return;
  const items=checkTemplates[type];
  const moved=items.splice(dragSrcIdx,1)[0];
  items.splice(toIdx,0,moved);
  saveCheckTemplates();
  toast('順番を変更しました');
  showCheckTemplateManager();
}

function addCheckItem(type){
  const text=prompt('新しいチェック項目を入力してください');
  if(!text||!text.trim())return;
  checkTemplates[type].push(text.trim());
  saveCheckTemplates();
  toast('追加しました');
  showCheckTemplateManager();
}

function editCheckItem(type,idx){
  const text=prompt('チェック項目を編集してください',checkTemplates[type][idx]);
  if(!text||!text.trim())return;
  checkTemplates[type][idx]=text.trim();
  saveCheckTemplates();
  toast('更新しました');
  showCheckTemplateManager();
}

function deleteCheckItem(type,idx){
  if(!confirm('このチェック項目を削除しますか？'))return;
  checkTemplates[type].splice(idx,1);
  saveCheckTemplates();
  toast('削除しました');
  showCheckTemplateManager();
}

// ===== 依頼を請ける =====
async function acceptProject(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  if(!confirm(`「${p.name}」の依頼を請けますか？`))return;
  p.status='請負済み';p.assignee=currentUser.name;p.acceptedAt=new Date().toLocaleString('ja-JP');
  await saveProjects();toast('✅ 請け負いました');
  setTimeout(()=>showDetail(id),600);
}

// ===== ファイル操作 =====
async function addFiles(id,input){
  const p=projects.find(x=>x.id===id);if(!p)return;
  for(const f of Array.from(input.files)){
    const data=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});
    const fileId='file_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    await dbPut('files',fileId,{name:f.name,type:f.type,data});
    p.files=p.files||[];p.files.push({name:f.name,type:f.type,fileId});
  }
  await saveProjects();toast('ファイルを追加しました');showDetail(id);
}
async function removeFile(pid,idx){
  if(!confirm('このファイルを削除しますか？'))return;
  const p=projects.find(x=>x.id===pid);
  const f=p.files[idx];if(f.fileId)await dbDelete('files',f.fileId);
  p.files.splice(idx,1);await saveProjects();toast('削除しました');showDetail(pid);
}
async function previewFile(pid,idx){
  const p=projects.find(x=>x.id===pid);const meta=p.files[idx];
  const area=document.getElementById('preview-area');if(!area)return;
  area.innerHTML='<div style="margin-top:1rem;padding:1rem;text-align:center;color:#888;font-size:13px">読み込み中...</div>';
  const f=await dbGet('files',meta.fileId);
  if(!f){area.innerHTML='<div style="margin-top:1rem;padding:1rem;color:#E24B4A;font-size:13px">ファイルが見つかりません</div>';return;}
  const isImg=f.type&&f.type.startsWith('image/');
  area.innerHTML=`<div style="margin-top:1rem;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:13px;font-weight:600">${f.name}</span>
      <button class="btn btn-sm" onclick="document.getElementById('preview-area').innerHTML=''">✕ 閉じる</button>
    </div>
    ${isImg?`<img src="${f.data}" style="max-width:100%;border-radius:8px">`:`<iframe src="${f.data}" style="width:100%;height:500px;border:none;border-radius:8px"></iframe>`}
  </div>`;
  area.scrollIntoView({behavior:'smooth'});
}

      <h2 style="font-size:16px;font-weight:600;margin-bottom:1rem">${isEdit?'物件情報を編集':'新しい物件を追加'}</h2>
      <div style="display:flex;flex-direction:column;gap:14px">
        ${field('物件名 <span style="color:#E24B4A">*</span>','name','text',p?.name||'')}
        ${field('主な工事内容 <span style="color:#E24B4A">*</span>','work','text',p?.work||'')}
        ${field('工事場所 <span style="color:#E24B4A">*</span>','place','text',p?.place||'')}
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">担当者名 <span style="color:#E24B4A">*</span></label>
          <select id="f-tantou">
            <option value="">-- 選択してください --</option>
            <option value="岡田/田中" ${p?.tantou==='岡田/田中'?'selected':''}>岡田/田中</option>
            <option value="竹田晶彦" ${p?.tantou==='竹田晶彦'?'selected':''}>竹田晶彦</option>
            <option value="曽田良治" ${p?.tantou==='曽田良治'?'selected':''}>曽田良治</option>
            <option value="土江徹郎" ${p?.tantou==='土江徹郎'?'selected':''}>土江徹郎</option>
            <option value="竹田和彦" ${p?.tantou==='竹田和彦'?'selected':''}>竹田和彦</option>
          </select>
        </div>
        ${field('工事開始日 <span style="color:#E24B4A">*</span>','start','date',p?.start||'')}
        ${field('工事終了日 <span style="color:#E24B4A">*</span>','end','date',p?.end||'')}
        ${field('希望工事金額（例: 850,000） <span style="color:#E24B4A">*</span>','amount','text',p?.amount||'')}
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">ステータス</label>
          <select id="f-status">
            <option value="募集中" ${(!p||p.status==='募集中')?'selected':''}>募集中</option>
            <option value="請負済み" ${p?.status==='請負済み'?'selected':''}>請負済み</option>
          </select>
        </div>
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">コメント <span style="color:#aaa;font-size:11px">（任意）</span></label>
          <textarea id="f-comment" rows="3" style="resize:vertical">${p?.comment||''}</textarea>
        </div>
        <button class="btn btn-primary" onclick="saveForm(${isEdit?p.id:'null'})" style="padding:10px;font-size:15px">${isEdit?'更新する':'追加する'}</button>
      </div>
    </div>
  </div>`);
}
function field(label,id,type,val){
  return `<div>
    <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">${label}</label>
    <input id="f-${id}" type="${type}" value="${val}">
  </div>`;
}
async function saveForm(editId){
  const get=id=>document.getElementById('f-'+id)?.value.trim()||'';
  const tantou=document.getElementById('f-tantou')?.value||'';
  const name=get('name'),work=get('work'),place=get('place'),start=get('start'),end=get('end'),amount=get('amount');
  if(!name||!work||!place||!tantou||!start||!end||!amount){alert('すべての必須項目を入力してください');return;}
  const status=document.getElementById('f-status').value;
  const comment=document.getElementById('f-comment').value.trim();
  if(editId!==null){
    const p=projects.find(x=>x.id===editId);
    Object.assign(p,{name,work,place,tantou,start,end,amount,status,comment});
    await saveProjects();showDetail(editId);
  }else{
    projects.push({id:Date.now(),name,work,place,tantou,start,end,amount,status,comment,files:[],assignee:null});
    await saveProjects();showList();
  }
}
async function deleteProject(id){
  if(!confirm('この物件を削除しますか？'))return;
  const p=projects.find(x=>x.id===id);
  for(const f of (p.files||[])){if(f.fileId)await dbDelete('files',f.fileId);}
  projects=projects.filter(x=>x.id!==id);await saveProjects();showList();
}

// ===== ユーザー管理 =====
function showUsers(){
  const roleOrder=['admin','kantoku','planner','worker'];
  const sorted=[...USERS].sort((a,b)=>roleOrder.indexOf(a.role)-roleOrder.indexOf(b.role));
  const rows=sorted.map(u=>`
  <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #f0f0f0;flex-wrap:wrap">
    <span style="font-size:12px;padding:2px 8px;border-radius:12px;${roleBadgeStyle(u.role)}">${roleLabel(u.role)}</span>
    <div style="flex:1">
      <div style="font-size:14px;font-weight:600">${u.name}</div>
      <div style="font-size:12px;color:#888">ID: ${u.id}　PW: ${u.pass}</div>
    </div>
    ${u.role!=='admin'?`<button class="btn btn-sm" onclick="showUserForm('${u.id}')">編集</button><button class="btn btn-danger btn-sm" onclick="deleteUser('${u.id}')">削除</button>`:''}
  </div>`).join('');
  render(`
  <div style="max-width:600px;margin:0 auto;padding:1rem">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
      <button class="btn btn-sm" onclick="showList()">← 戻る</button>
      <span style="font-size:13px;color:#888">ユーザー管理</span>
    </div>
    <div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1.25rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <h2 style="font-size:16px;font-weight:600">👥 登録済みユーザー</h2>
        <button class="btn btn-primary btn-sm" onclick="showUserForm(null)">＋ 追加</button>
      </div>
      ${rows}
    </div>
  </div>`);
}
function showUserForm(editId){
  const u=editId?USERS.find(x=>x.id===editId):null;
  const isEdit=!!u;
  render(`
  <div style="max-width:500px;margin:0 auto;padding:1rem">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
      <button class="btn btn-sm" onclick="showUsers()">← 戻る</button>
    </div>
    <div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1.25rem">
      <h2 style="font-size:16px;font-weight:600;margin-bottom:1rem">${isEdit?(u.name+' を編集'):'新しいユーザーを追加'}</h2>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">名前</label>
          <input id="u-name" type="text" value="${u?.name||''}" placeholder="例: 山田 太郎">
        </div>
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">ログインID</label>
          <input id="u-id" type="text" value="${u?.id||''}" ${isEdit?'readonly style="background:#f5f5f5;cursor:not-allowed"':''}>
          ${isEdit?'<p style="font-size:11px;color:#aaa;margin-top:3px">IDは変更できません</p>':''}
        </div>
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">パスワード</label>
          <input id="u-pass" type="text" value="${u?.pass||''}">
        </div>
        <div>
          <label style="font-size:13px;color:#555;display:block;margin-bottom:4px">役割</label>
          <select id="u-role" ${isEdit?'disabled style="background:#f5f5f5"':''}>
            <option value="kantoku" ${u?.role==='kantoku'?'selected':''}>現場監督</option>
            <option value="planner" ${u?.role==='planner'?'selected':''}>プランナー</option>
            <option value="worker" ${u?.role==='worker'?'selected':''}>職人</option>
          </select>
        </div>
        <div id="u-err" style="color:#E24B4A;font-size:13px;display:none"></div>
        <button class="btn btn-primary" onclick="saveUser('${editId||''}')" style="padding:10px;font-size:15px">${isEdit?'更新する':'追加する'}</button>
      </div>
    </div>
  </div>`);
}
function saveUser(editId){
  const name=document.getElementById('u-name').value.trim();
  const uid=document.getElementById('u-id').value.trim();
  const pass=document.getElementById('u-pass').value.trim();
  const role=document.getElementById('u-role').value;
  const err=document.getElementById('u-err');
  if(!name||!uid||!pass){err.textContent='すべての項目を入力してください';err.style.display='block';return;}
  if(!editId){
    if(USERS.find(u=>u.id===uid)){err.textContent='このIDはすでに使われています';err.style.display='block';return;}
    USERS.push({id:uid,name,pass,role});
  }else{
    const u=USERS.find(x=>x.id===editId);
    if(u){u.name=name;u.pass=pass;}
  }
  saveUsers();toast('保存しました');showUsers();
}
function deleteUser(uid){
  if(!confirm('このユーザーを削除しますか？'))return;
  USERS=USERS.filter(u=>u.id!==uid);saveUsers();toast('削除しました');showUsers();
}

// ===== 起動 =====
openDB().then(loadProjects).then(showLogin);
</script>
